services:
  modbot:
    build: .
    container_name: namek-modbot
    restart: unless-stopped
    # host-сеть: бот может ходить к серверу игры через локальный порт (NAMEK_VIA)
    network_mode: host
    environment:
      # TELEGRAM_BOT_TOKEN, ADMIN_CHAT_ID, MOD_KEY и NAMEK_VIA лежат в /root/namek-modbot/.env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:?}
      MOD_KEY: ${MOD_KEY:?}
      NAMEK_VIA: ${NAMEK_VIA:-}
    mem_limit: 64m
    logging:
      options:
        max-size: '2m'
        max-file: '2'
