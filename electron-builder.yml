appId: com.vldvr.namek
productName: Namek
copyright: © 2026 vldvr
directories:
  output: release
  buildResources: build
electronLanguages:
  - ru
  - en-US
files:
  - out/**
  - resources/**
  - package.json
win:
  icon: build/icon.png
  executableName: Namek
  # Имя для zip (nsis и portable задают свои ниже). Лаунчер ищет именно Namek-<версия>-win-x64.zip.
  artifactName: Namek-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    # zip ставит лаунчер Sevensave: распаковывает в свою библиотеку и запускает без установщика.
    - target: zip
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Намёк
  uninstallDisplayName: Намёк
  deleteAppDataOnUninstall: false
  artifactName: Namek-Setup-${version}.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.card-games
  # Подписи Apple нет: подписываем ad-hoc, иначе на Apple Silicon macOS называет приложение повреждённым.
  identity: '-'
  hardenedRuntime: false
  # zip нужен для самообновления: приложение качает его и подменяет Namek.app (см. src/main/updater.ts).
  artifactName: Namek-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  title: Намёк
portable:
  artifactName: Namek-${version}-portable.${ext}
publish:
  provider: github
  owner: vldvr
  repo: namek
  releaseType: draft
